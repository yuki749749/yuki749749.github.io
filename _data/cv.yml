      - bullet: '<strong><u>Y. Okamoto</u></strong> and T. Sato, "Proposal and cost evaluation of observation point placement method for underwater monitoring of sub-seabed CCS," presented at The Japan Society of Naval Architects and Ocean Engineers 2024 Annual Spring Meeting, Kanazawa, Japan, May 27-28, 2024.'

