    Experience:
      - company: KTH Royal Institute of Technology
        position: Master's Thesis Student at Division of Probability, Mathematical Physics and Statistics
        location: Stockholm, Sweden
        start_date: 2025
        end_date: "Present"
        summary: "Supervisor: Asst. Prof. Soon Hoe Lim. Thesis Title: Belief-conditioned Diffusion Planner for Field Estimation"
        highlights:
          - Formulated adaptive trajectory planning as a conditional inference problem by training a diffusion model over kinematically constrained path distributions conditioned on Gaussian process belief states.
          - Integrated Gaussian process belief modelling, classifier-free guidance, and receding horizon control into a unified inference pipeline.

      - company: KTH Royal Institute of Technology
        position: Research Assistant at Medical Imaging Physics Group
        location: Stockholm, Sweden
        start_date: 2025
        end_date: "Present"
        summary: "Supervisors: Prof. Mats Danielsson, Assoc. Prof. Mats Persson, Per Lundhammar"
        highlights:
          - Designed and implemented a permutation-equivariant deep learning model using Set Transformer to infer temporal ordering of unordered photon detection data in SPECT imaging.
          - Reduced inference complexity from factorial time to a single forward pass while achieving competitive ordering accuracy for short chain lengths against a maximum likelihood baseline.

      - company: National Ocean Policy Secretariat, Cabinet Office, Government of Japan
        position: Research Assistant
        location: Tokyo, Japan
        start_date: 2024
        end_date: 2024
        summary: "Supervisors: Prof. Toru Sato, Toshiro Suzuki, Takamasa Nakamura"
        highlights:
          - Developed a stochastic risk assessment model using Bayesian Monte Carlo simulations to quantify the frequency and magnitude of global mineral resource supply disruptions.
          - Evaluated the economic security value of domestic mineral resource development by modeling the avoided production losses enabled by strategic stockpiling.

      - company: The University of Tokyo
        position: Bachelor's Thesis Student at Laboratory of Environmental Modeling and Synthesis
        location: Tokyo, Japan
        start_date: 2023
        end_date: 2024
        summary: "Supervisor: Prof. Toru Sato. Thesis Title: Proposal and cost evaluation of observation point placement method for underwater monitoring of sub-seabed CCS"
        highlights:
          - Developed a cost-efficient monitoring framework for offshore carbon capture and storage (CCS).
          - Performed large-scale numerical simulations to analyze environmental impacts of CO₂ leakage.
          - Designed and implemented a modified greedy solution for optimal coverage problems.

      - company: TEDxUTokyo
        position: Board Member
        location: Tokyo, Japan
        start_date: 2021
        end_date: 2022
        summary: "Event organization and leadership"
        highlights:
          - Co-organized a TEDx conference at the University of Tokyo with 400 participants.
          - Managed logistics, coordinated with stakeholders, and secured over 10 enterprise sponsorships.
          - Gained experience in structured administration and event management.

